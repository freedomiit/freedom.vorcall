name: release

# Client release: builds the macOS desktop client, picks up the Linux and
# Windows binaries the owner pushed to the host, signs one manifest covering
# all three platforms and publishes it to the host's `releases/` directory,
# which the backend serves to signed-in clients through `/api/updates/*`.
#
# Linux and Windows are NOT built here. `scripts/push-client.sh` builds them on
# the owner's machine (native, and cargo-xwin for Windows), checksums them and
# scp's them into `${APP_DIR}/releases/<version>/` before the tag is pushed.
# This workflow fetches them back from there.
#
# Flow:
#   1. job "preflight"         — reads version/min_version from client/Cargo.toml,
#      asserts the tag matches the workspace version and extracts the release
#      notes from the annotated tag.
#   2. job "icons"             — renders vorcall.ico for the Windows installer.
#   3. job "build"             — builds vorcall on macos-latest with the
#      production server key baked in, checks the binary reports the expected
#      version, wraps it as Vorcall.app inside a DMG and uploads binary +
#      .sha256 + DMG.
#   4. job "windows-installer" — publish only: fetches the pushed
#      vorcall-windows-x86_64.exe from the host, verifies its checksum and
#      compiles the per-user Inno Setup installer around it.
#   5. job "publish"           — assembles manifest.json (macOS from job 3,
#      Linux/Windows fetched from the host), signs it (Ed25519) and verifies the
#      signature against client/update-keys.pub. When publishing, it copies the
#      macOS binary and the manifest to the host, swaps the manifest atomically,
#      prunes old versions and creates the GitHub Release.
#
# Dry run vs publish:
#   - a tag push (v*) always publishes;
#   - a manual dispatch publishes only when the "publish" input is checked.
#     Unchecked is a dry run: it builds macOS, signs and verifies a macOS-only
#     manifest and leaves everything as workflow artifacts — the host is never
#     read or written, so a dry run needs nothing pushed to it, and no GitHub
#     Release is created.
#   - a dry run needs no tag; publishing (a tag push, or a dispatch with
#     publish checked) requires tag vX.Y.Z on the checked-out commit.
#
# Release runbook:
#   1. bump `version` (and `min_version` if old clients must be cut off) in
#      client/Cargo.toml, commit, push.
#   2. `git tag -a vX.Y.Z -m "notes"`.
#   3. `scripts/push-client.sh` — builds Linux + Windows locally and pushes them
#      to the host.
#   4. `git push origin vX.Y.Z`.
#
# Prerequisites (one time):
#   - Secret VORCALL_SERVER_KEY — the production door key, the same value as
#     Vorcall__ServerKey in the host `.env`. Baked into the binaries at build
#     time; a rotation therefore needs a new release.
#   - Secret VORCALL_UPDATE_SIGNING_KEY — hex Ed25519 private key from
#     `vorcall-release gen-key`. Its public half must be committed in
#     client/update-keys.pub, otherwise clients reject the manifest (the
#     verify step below catches that here).
#   - Secret SSH_PRIVATE_KEY — runner -> server, shared with deploy.yml.
#   - `${APP_DIR}/releases/` on the host, created by deploy/provision-host.sh
#     and bind-mounted read-only into the backend container
#     (docker-compose.prod.yml).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to the host and create the GitHub Release (unchecked = dry run: build macOS, sign, verify, keep artifacts only)"
        type: boolean
        default: false

# never let two releases race for the manifest
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  SERVER: user@host
  APP_DIR: /opt/vorcall
  VORCALL_SERVER_URL: https://vorcall.example.com

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.meta.outputs.version }}
      min_version: ${{ steps.meta.outputs.min_version }}
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
        with:
          # full history: the tag object and its annotation (release notes) are
          # not fetched by a shallow checkout.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Read the workspace version
        id: meta
        shell: bash
        working-directory: client
        run: |
          set -euo pipefail
          meta=$(cargo metadata --no-deps --format-version 1)
          version=$(jq -r '.packages[] | select(.name=="vorcall-app") | .version' <<<"$meta")
          min=$(jq -r '.metadata.vorcall.min_version' <<<"$meta")
          [ -n "$version" ] && [ "$min" != "null" ] || { echo "cannot read version/min_version from Cargo.toml"; exit 1; }
          # min_version must not exceed version (three-integer compare via sort -V)
          [ "$(printf '%s\n%s\n' "$min" "$version" | sort -V | head -n1)" = "$min" ] || { echo "min_version $min is above version $version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "min_version=$min" >> "$GITHUB_OUTPUT"

      - name: Decide whether to publish
        id: decide
        shell: bash
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            publish=true
          else
            publish=${{ inputs.publish }}
          fi
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

      - name: Assert the tag matches
        # A published release must be exactly the workspace version; a dry run
        # only needs the version to build and name its artifacts.
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          PUBLISH: ${{ steps.decide.outputs.publish }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            [ "$GITHUB_REF_NAME" = "v$VERSION" ] || { echo "tag $GITHUB_REF_NAME does not match workspace version $VERSION (expected v$VERSION)"; exit 1; }
          elif [ "$PUBLISH" = true ]; then
            git tag --points-at HEAD | grep -qx "v$VERSION" || { echo "publishing from a dispatch requires tag v$VERSION on the checked-out commit"; exit 1; }
          else
            echo "dry run of $VERSION: no tag required"
          fi

      - name: Release notes from the annotated tag
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          # a lightweight tag, or no tag yet (dry run), carries no message: empty notes, not a failure
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null && [ "$(git cat-file -t "v$VERSION")" = tag ]; then
            git tag -l --format='%(contents)' "v$VERSION" > notes.md
          else
            : > notes.md
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: notes
          path: notes.md
          retention-days: 7

  icons:
    # The Windows icon, rendered from assets/brand/icon.svg where an SVG
    # renderer is an apt package away, and handed to the Windows installer job
    # for the installer and its shortcuts.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Render vorcall.ico
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends librsvg2-bin python3-pil
          scripts/make-windows-icon.sh icons/vorcall.ico

      - uses: actions/upload-artifact@v7
        with:
          name: icons
          path: icons/vorcall.ico
          retention-days: 7
          if-no-files-found: error

  build:
    needs: [preflight]
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: macos-latest, platform: macos-aarch64, ext: "" }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: client
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      PLATFORM: ${{ matrix.platform }}
      EXT: ${{ matrix.ext }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client
          key: release-${{ matrix.platform }}

      - name: Check the server key secret
        # client/.cargo/config.toml defaults the key to "dev"; a release built
        # with it could not talk to production.
        env:
          VORCALL_SERVER_KEY: ${{ secrets.VORCALL_SERVER_KEY }}
        run: '[ -n "$VORCALL_SERVER_KEY" ] && [ "$VORCALL_SERVER_KEY" != dev ] || { echo "VORCALL_SERVER_KEY secret is missing or still ''dev''"; exit 1; }'

      - name: Build
        env:
          VORCALL_SERVER_KEY: ${{ secrets.VORCALL_SERVER_KEY }}
        run: cargo build --release -p vorcall-app

      - name: No aws-lc-rs in the graph
        # the Windows cross build (cargo-xwin, run by scripts/push-client.sh)
        # and this release gate both depend on aws-lc-rs staying out of the
        # client dependency graph.
        run: if cargo tree -i aws-lc-rs >/dev/null 2>&1; then echo "aws-lc-rs is in the dependency graph"; exit 1; fi

      - name: Collect
        run: |
          set -euo pipefail
          mkdir -p ../dist && cp "target/release/vorcall${EXT}" "../dist/vorcall-${PLATFORM}${EXT}"

      - name: Ad-hoc signature
        # Apple Silicon refuses to run unsigned arm64 binaries; an ad-hoc
        # signature is enough to launch. Gatekeeper's first-run prompt is
        # documented in the README.
        run: codesign -s - --force "../dist/vorcall-macos-aarch64" && codesign -dv "../dist/vorcall-macos-aarch64"

      - name: Check the reported version
        run: |
          set -euo pipefail
          out=$("../dist/vorcall-${PLATFORM}" --version)
          [ "$out" = "vorcall ${VERSION} ${PLATFORM}" ] || { echo "binary reports '$out'"; exit 1; }

      - name: App bundle
        # Vorcall.app in a DMG is what a friend installs; scripts/bundle-client-macos.sh
        # renders the icon (rsvg-convert), writes Info.plist, signs ad-hoc and builds
        # the drag-to-Applications image with hdiutil.
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: |
          set -euo pipefail
          brew install --quiet librsvg
          ../scripts/bundle-client-macos.sh "../dist/vorcall-${PLATFORM}" "$VERSION" ../dist

      - name: Checksum
        # run inside dist/ so the file holds "<hash>  <name>" with no path
        run: |
          set -euo pipefail
          cd ../dist
          for f in "vorcall-${PLATFORM}${EXT}" "vorcall-${PLATFORM}.dmg"; do
            if [ -f "$f" ]; then sha256sum "$f" > "$f.sha256"; fi
          done

      - uses: actions/upload-artifact@v7
        with:
          name: vorcall-${{ matrix.platform }}
          path: dist/vorcall-${{ matrix.platform }}*
          retention-days: 7
          if-no-files-found: error

  windows-installer:
    # Publish only: the installer wraps the exe scripts/push-client.sh built and
    # pushed to the host, so there is nothing to wrap on a dry run.
    needs: [preflight, icons]
    if: needs.preflight.outputs.publish == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up the SSH key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Fetch the pushed Windows binary from the host
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          # StrictHostKeyChecking=accept-new instead of ssh-keyscan: the Windows
          # runner's ssh-keyscan is not guaranteed to be the same OpenSSH.
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new \
            "$SERVER:$APP_DIR/releases/$VERSION/vorcall-windows-x86_64.exe" \
            "$SERVER:$APP_DIR/releases/$VERSION/vorcall-windows-x86_64.exe.sha256" \
            dist/ || { echo "vorcall-windows-x86_64.exe is not on the host for $VERSION — run scripts/push-client.sh first"; exit 1; }
          cd dist && sha256sum -c vorcall-windows-x86_64.exe.sha256

      - uses: actions/download-artifact@v8
        with:
          name: icons
          path: icons

      - name: Windows installer
        # packaging/windows/vorcall.iss: per-user (Start menu entry, icon,
        # uninstaller) into the account's local programs folder, which the
        # updater can write to. pwsh keeps MSYS from rewriting the /D switches.
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $dist = Join-Path $env:GITHUB_WORKSPACE "dist"
          & $iscc "/DAppVersion=$env:VERSION" "/DSourceDir=$dist" "/DOutputDir=$dist" "/DIconFile=$env:GITHUB_WORKSPACE\icons\vorcall.ico" "$env:GITHUB_WORKSPACE\packaging\windows\vorcall.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Checksum
        shell: bash
        run: |
          set -euo pipefail
          cd dist && sha256sum vorcall-windows-x86_64-setup.exe > vorcall-windows-x86_64-setup.exe.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: vorcall-windows-installer
          path: dist/vorcall-windows-x86_64-setup.exe*
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: [preflight, build, windows-installer]
    # windows-installer is skipped on a dry run, which would skip this job too
    # under the default "all needs succeeded" rule.
    if: always() && needs.preflight.result == 'success' && needs.build.result == 'success' && (needs['windows-installer'].result == 'success' || needs['windows-installer'].result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      MIN_VERSION: ${{ needs.preflight.outputs.min_version }}
      PUBLISH: ${{ needs.preflight.outputs.publish }}
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client
          key: release-tool

      - uses: actions/download-artifact@v8
        with:
          name: vorcall-macos-aarch64
          path: dist

      - uses: actions/download-artifact@v8
        with:
          name: notes
          path: dist

      - uses: actions/download-artifact@v8
        if: needs.preflight.outputs.publish == 'true'
        with:
          name: vorcall-windows-installer
          path: dist

      - name: Build the release tool
        run: cd client && cargo build --release -p vorcall-release

      - name: Set up the SSH key
        if: needs.preflight.outputs.publish == 'true'
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H 203.0.113.10 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Fetch the pushed Linux and Windows binaries from the host
        if: needs.preflight.outputs.publish == 'true'
        run: |
          set -euo pipefail
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            "$SERVER:$APP_DIR/releases/$VERSION/vorcall-linux-x86_64" \
            "$SERVER:$APP_DIR/releases/$VERSION/vorcall-linux-x86_64.sha256" \
            "$SERVER:$APP_DIR/releases/$VERSION/vorcall-windows-x86_64.exe" \
            "$SERVER:$APP_DIR/releases/$VERSION/vorcall-windows-x86_64.exe.sha256" \
            "$SERVER:$APP_DIR/releases/$VERSION/vorcall-linux-x86_64.tar.gz" \
            dist/ || { echo "the Linux/Windows release files are not on the host for $VERSION — run scripts/push-client.sh for v$VERSION first"; exit 1; }
          cd dist
          sha256sum -c vorcall-linux-x86_64.sha256
          sha256sum -c vorcall-windows-x86_64.exe.sha256
          sha256sum vorcall-linux-x86_64.tar.gz > vorcall-linux-x86_64.tar.gz.sha256

      - name: Assemble the manifest
        # A dry run has only the macOS binary (the host is never read), so it
        # signs a macOS-only manifest — enough to prove the key and the tooling.
        run: |
          set -euo pipefail
          assets=(--asset "macos-aarch64=dist/vorcall-macos-aarch64")
          if [ "$PUBLISH" = true ]; then
            assets+=(--asset "linux-x86_64=dist/vorcall-linux-x86_64")
            assets+=(--asset "windows-x86_64=dist/vorcall-windows-x86_64.exe")
          fi
          client/target/release/vorcall-release manifest \
            --version "$VERSION" \
            --min-version "$MIN_VERSION" \
            --notes-file dist/notes.md \
            "${assets[@]}" \
            --out dist/manifest.json

      - name: Sign the manifest
        # a dry run signs too: a signing key or public-key mismatch must fail
        # here, not on the release that actually reaches the clients.
        env:
          VORCALL_UPDATE_SIGNING_KEY: ${{ secrets.VORCALL_UPDATE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          [ -n "$VORCALL_UPDATE_SIGNING_KEY" ] || { echo "VORCALL_UPDATE_SIGNING_KEY secret is missing"; exit 1; }
          client/target/release/vorcall-release sign --key-env VORCALL_UPDATE_SIGNING_KEY dist/manifest.json --out dist/manifest.sig

      - name: Verify against the committed public keys
        # fails when the signing key's public half is not in
        # client/update-keys.pub — i.e. clients would refuse this manifest.
        run: client/target/release/vorcall-release verify --keys client/update-keys.pub dist/manifest.json dist/manifest.sig

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ needs.preflight.outputs.version }}
          path: dist/*
          retention-days: 7

      - name: Copy the release to the host
        if: needs.preflight.outputs.publish == 'true'
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$SERVER" "mkdir -p '$APP_DIR/releases/$VERSION'"
          # only the macOS binary goes up: the Linux and Windows ones are already
          # there, put by scripts/push-client.sh, and the tarball, the installer
          # and the DMG are first-install downloads served by the GitHub Release
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes \
            dist/vorcall-macos-aarch64 dist/vorcall-macos-aarch64.sha256 \
            "$SERVER:$APP_DIR/releases/$VERSION/"
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes dist/manifest.json "$SERVER:$APP_DIR/releases/manifest.json.tmp"
          scp -i ~/.ssh/deploy_key -o IdentitiesOnly=yes dist/manifest.sig "$SERVER:$APP_DIR/releases/manifest.sig.tmp"

      - name: Activate the manifest and prune old versions
        if: needs.preflight.outputs.publish == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes "$SERVER" \
            "APP_DIR='$APP_DIR' bash -s" <<'EOF'
          set -euo pipefail
          cd "$APP_DIR/releases"
          # sig first, then json: a client that reads the pair mid-swap fails verification and retries later,
          # never the other way round (new json + old sig would also fail, but json is what the server 404s on).
          mv -f manifest.sig.tmp manifest.sig
          mv -f manifest.json.tmp manifest.json
          # keep the five newest X.Y.Z directories (sort -V orders 0.10.0 after 0.9.0, unlike a lexical sort)
          ls -d */ 2>/dev/null | tr -d / | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | head -n -5 | xargs -r rm -rf --
          ls -la
          head -c 300 manifest.json; echo
          EOF

      - name: GitHub Release
        if: needs.preflight.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          assets=(dist/vorcall-* dist/manifest.json dist/manifest.sig)
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" --title "Vorcall $VERSION" --notes-file dist/notes.md "${assets[@]}"
          fi
