name: ci

# Quality gates for visibility only: format, lint and build of both sides.
# The deploy workflow does NOT wait for this run (same policy as the rest of
# the fleet) — a red CI is a signal to fix, not a deploy block.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: client

      - name: ALSA headers (rodio/cpal), PipeWire headers + libclang (screen capture bindings)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libasound2-dev libpipewire-0.3-dev libclang-dev

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build server/Vorcall.Server.csproj -warnaserror -nologo
