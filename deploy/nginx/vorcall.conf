# vorcall.example.com — final site. provision-host.sh rewrites this hostname
# to $DOMAIN as it installs the file; never edit it to a real domain here.
#
# DNS-only (no Cloudflare proxy): TLS is terminated here with a Let's Encrypt
# certificate issued by certbot through the webroot at /var/www/certbot.
# The backend runs in Docker and listens on the loopback port 127.0.0.1:5004.
# No `default_server` here — that is already owned by another site on this host.
server {
    listen 80;
    listen [::]:80;
    server_name vorcall.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # http2 matches the other sites on this shared 443 socket; nginx 1.24 warns
    # "protocol options redefined" when server blocks disagree. WebSocket
    # clients speak HTTP/1.1 (no ALPN), so /ws is unaffected.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vorcall.example.com;

    ssl_certificate     /etc/letsencrypt/live/vorcall.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vorcall.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:vorcall_ssl:1m;
    ssl_session_timeout 1d;

    client_max_body_size 64k;

    # Live chat: WebSocket, long-lived.
    location = /ws {
        proxy_pass http://127.0.0.1:5004;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Update downloads stream a whole client binary: no buffering and longer
    # timeouts than the API default (60 s). Prefix match beats /api/.
    location /api/updates/ {
        proxy_pass http://127.0.0.1:5004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Attachment uploads and downloads: any file type, up to 2 GiB each
    # (AttachmentsOptions.MaxFileBytes = 2L << 30). Matching that number here
    # means nginx's ceiling and the backend's are the same one, and nginx only
    # rejects what exceeds it, so a legitimate maximum-size attachment still
    # passes; this guards against a non-Vorcall or misbehaving client, since
    # the Vorcall client already checks the size itself before uploading
    # (too_large() in client/crates/vorcall-core/src/attachments.rs).
    # Buffering stays off in both directions: nginx must never spool a 2 GiB
    # body to disk. 3600s because a 2 GiB transfer over a domestic uplink
    # outlasts the 300 s used elsewhere.
    location /api/attachments {
        client_max_body_size 2g;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass http://127.0.0.1:5004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Avatars, banners and icons: the same raw-body upload shape as an attachment,
    # but a different limit on purpose — the image store caps a picture at 8 MiB
    # (AttachmentsOptions.ImageMaxFileBytes), unlike an attachment's 2 GiB. Do not
    # "unify" this with the block above: 9m is the ceiling this endpoint enforces.
    location /api/images {
        client_max_body_size 9m;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://127.0.0.1:5004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Soundpad clips: the same raw-body upload shape again, with a third limit on
    # purpose — a clip is capped at 16 MiB (AttachmentsOptions.SoundMaxFileBytes),
    # between an image's 8 MiB and an attachment's 2 GiB. Do not fold this into
    # either neighbour: 17m is the ceiling this endpoint enforces.
    location /api/sounds {
        client_max_body_size 17m;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://127.0.0.1:5004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Stickers: the same raw-body upload shape, capped at 1 MiB
    # (AttachmentsOptions.StickerMaxFileBytes). 2m leaves headroom over that cap so
    # the endpoint, not nginx, answers an oversized body.
    location /api/stickers {
        client_max_body_size 2m;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://127.0.0.1:5004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Streamed files: nothing is stored here, the server proxies bytes between the
    # reader's GET and the sending client's chunk POST. Both directions carry the
    # payload — the GET streams the response body, the chunk POST streams the
    # request body — so both buffers are off, or nginx would hold a whole transfer.
    # No size ceiling is derivable: the chunk body is whatever range was asked for,
    # of a file up to 1 TiB (StreamOptions.MaxFileBytes), and the server sets its
    # own per-request limit from the pending range, so 0 defers the check to it.
    # A transfer waits on a human's client and then runs at their upload speed,
    # hence the hour-long timeouts.
    location /api/streams {
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass http://127.0.0.1:5004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # problem reports: a streamed upload of logs, larger body than the API default
    location /api/diagnostics {
        client_max_body_size 5m;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_pass http://127.0.0.1:5004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # The admin endpoints are for the CLI on the compose network only, never from outside.
    location /api/admin/ {
        return 404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /health {
        proxy_pass http://127.0.0.1:5004/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        return 404;
    }
}
