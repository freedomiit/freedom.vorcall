# vorcall.example.com — final site.
#
# DNS-only (no Cloudflare proxy): TLS is terminated here with a Let's Encrypt
# certificate issued by certbot through the webroot at /var/www/certbot.
# The backend runs in Docker and listens on the loopback port 127.0.0.1:5004.
# No `default_server` here — that is already owned by another site on this host.
server {
    listen 80;
    listen [::]:80;
    server_name vorcall.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # http2 matches the other sites on this shared 443 socket; nginx 1.24 warns
    # "protocol options redefined" when server blocks disagree. WebSocket
    # clients speak HTTP/1.1 (no ALPN), so /ws is unaffected.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vorcall.example.com;

    ssl_certificate     /etc/letsencrypt/live/vorcall.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vorcall.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:vorcall_ssl:1m;
    ssl_session_timeout 1d;

    client_max_body_size 64k;

    # Live chat: WebSocket, long-lived.
    location = /ws {
        proxy_pass http://127.0.0.1:5004;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Update downloads stream a whole client binary: no buffering and longer
    # timeouts than the API default (60 s). Prefix match beats /api/.
    location /api/updates/ {
        proxy_pass http://127.0.0.1:5004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # image uploads and downloads: streamed, larger body, longer timeouts
    location /api/attachments {
        client_max_body_size 9m;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://127.0.0.1:5004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Avatars, banners and icons: the same raw-body upload as an attachment, so the same
    # larger body, unbuffered proxying and longer timeouts.
    location /api/images {
        client_max_body_size 9m;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_pass http://127.0.0.1:5004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # problem reports: a streamed upload of logs, larger body than the API default
    location /api/diagnostics {
        client_max_body_size 5m;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_pass http://127.0.0.1:5004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # The admin endpoints are for the CLI on the compose network only, never from outside.
    location /api/admin/ {
        return 404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /health {
        proxy_pass http://127.0.0.1:5004/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        return 404;
    }
}
