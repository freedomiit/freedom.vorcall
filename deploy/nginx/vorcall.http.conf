# vorcall.example.com — bootstrap site: ACME webroot on :80 only.
# Replaced by vorcall.conf once the Let's Encrypt certificate exists.
server {
    listen 80;
    listen [::]:80;
    server_name vorcall.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
