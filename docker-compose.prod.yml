# The maintainer's production stack: pulls a pre-built image from a registry
# instead of building it. Self-hosting uses docker-compose.yml — see
# docs/self-hosting.md. Everything host-specific lives in the host's own .env.
#
# TLS is terminated by the host nginx (Let's Encrypt); this stack only
# publishes the backend on a loopback port that nginx proxies to.
# Images are built in CI (GitHub Actions) and merely pulled here — never
# built on the host. IMAGE_TAG is the commit SHA pushed by the deploy
# workflow and defaults to `latest`.
# Variables come from the `.env` file next to this compose file, which is
# never committed (see .env.production.example).
# The host needs `docker login ghcr.io` once, the images are private.

services:
  db:
    image: postgres:18
    container_name: vorcall-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
    volumes:
      # postgres:18 stores data under /var/lib/postgresql (per-major subdirectory).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  backend:
    image: ghcr.io/freedomiit/vorcall-backend:${IMAGE_TAG:-latest}
    container_name: vorcall-backend
    restart: always
    env_file: .env
    ports:
      # loopback only; the host nginx publishes it
      - "127.0.0.1:5004:5000"
      # voice media relay: UDP, public on purpose (clients talk to it directly, nginx cannot proxy UDP).
      # Also needs an ingress rule for UDP 5005 in the OCI VCN security list.
      - "5005:5005/udp"
    volumes:
      # release manifests + client binaries published by .github/workflows/release.yml
      # (releases/<version>/…, releases/manifest.json, releases/manifest.sig); served
      # by /api/updates/*. Read-only: the workflow writes, the backend only reads.
      - ./releases:/releases:ro
      # image attachments uploaded through /api/attachments; written by the
      # backend, so not read-only. Quota is Vorcall__AttachmentsMaxBytes.
      - ./attachments:/attachments
      # daily JSON logs written by the backend, kept 31 days by the server itself
      - ./logs:/logs
      # problem reports uploaded through /api/diagnostics; swept after 30 days
      - ./diagnostics:/diagnostics
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # /health answers 200 only after migration completed and the DB answers.
      test: ["CMD-SHELL", "curl -fsS http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  pgdata:
