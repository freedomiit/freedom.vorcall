syntax = "proto3";

package vorcall.v1;

option csharp_namespace = "Vorcall.Server.Protocol";

// A persisted chat message. Ids are server-assigned and strictly increasing across all rooms.
message ChatMessage {
  int64 id = 1;
  string author = 2;              // username at the time of sending
  string text = 3;
  int64 sent_at_unix_ms = 4;
  string room_id = 5;             // the room the message belongs to
  int64 author_id = 6;            // user id; 0 for messages that predate accounts
  int64 edited_at_unix_ms = 7;    // 0 = never edited
  bool deleted = 8;               // tombstone: text is empty, no attachments, no reactions
  ReplyRef reply_to = 9;          // absent when not a reply; filled by the server at read time
  repeated int64 mention_ids = 10;      // users named by <@id> tokens in text, validated by the server
  repeated Reaction reactions = 11;     // grouped by emoji, user ids ascending
  repeated Attachment attachments = 12;
}

// A snapshot of the message a reply points at, resolved when the reply is read.
message ReplyRef {
  int64 id = 1;
  string author = 2;
  string excerpt = 3;             // first 120 scalars of the target's current text
  bool deleted = 4;               // the target is a tombstone
}

// One emoji and everyone who reacted with it.
message Reaction {
  string emoji = 1;
  repeated int64 user_ids = 2;    // ascending
}

// An image attached to a message.
// REST: POST /api/attachments?room=<id> -> Attachment
// REST: GET /api/attachments/{id} -> the bytes
message Attachment {
  int64 id = 1;
  string file_name = 2;
  string content_type = 3;
  int64 size = 4;                 // bytes
}

enum RoomKind {
  ROOM_KIND_UNSPECIFIED = 0;
  ROOM_KIND_PUBLIC = 1;           // any account may see and join
  ROOM_KIND_DM = 2;               // exactly two permanent members
}

// The shared facts about a room; counters are per reader and live in RoomEntry.
message Room {
  string room_id = 1;
  RoomKind kind = 2;
  string name = 3;                // display name; empty for DMs
  repeated int64 member_ids = 4;  // persistent membership; "joined" is this list containing me
  int64 created_by = 5;
}

// One room as it appears in RoomList, with the reader's own counters.
message RoomEntry {
  Room room = 1;
  int64 unread = 2;
  int64 mentions = 3;
  int64 last_message_id = 4;
}

// Client -> server. One ClientFrame per binary WebSocket message.
message ClientFrame {
  oneof payload {
    Hello hello = 1;
    SendMessage send = 2;
    Ping ping = 3;
    JoinRoom join_room = 4;
    LeaveRoom leave_room = 5;
    JoinVoice join_voice = 6;
    LeaveVoice leave_voice = 7;
    CreateRoom create_room = 8;
    OpenDm open_dm = 9;
    MarkRead mark_read = 10;
    EditMessage edit_message = 11;
    DeleteMessage delete_message = 12;
    React react = 13;
  }
}

// Must be the first frame after the upgrade. Identity comes from the bearer token of the upgrade request.
message Hello {
  uint32 protocol_version = 1;             // must be 1
  string nickname = 2 [deprecated = true]; // ignored by the server since accounts exist
  string client_version = 3;               // optional; the client's own version, e.g. "0.2.0"; logged and stored, never enforced
  string client_platform = 4;              // optional; e.g. "linux-x86_64", "windows-x86_64", "macos-aarch64"
}

message SendMessage {
  string text = 1;                // trimmed, 1..2000 chars; may be empty only with attachments
  string room_id = 2;             // empty means "general"
  int64 reply_to_id = 3;          // 0 = not a reply; otherwise a message of the same room
  repeated int64 attachment_ids = 4; // at most 4, uploaded by the sender to this room, not yet linked
}

message Ping {
  int64 sent_at_unix_ms = 1;
}

message JoinRoom {
  string room_id = 1;
}

message LeaveRoom {
  string room_id = 1;
}

message CreateRoom {
  string name = 1;                // trimmed, 1..32 scalars; its slug becomes the room id
}

message OpenDm {
  int64 user_id = 1;              // the other party; the DM is created on first use
}

message MarkRead {
  string room_id = 1;
  int64 message_id = 2;           // the newest message the reader has seen
}

message EditMessage {
  int64 id = 1;
  string text = 2;                // same rules as SendMessage.text, never empty
}

message DeleteMessage {
  int64 id = 1;
}

message React {
  int64 message_id = 1;
  string emoji = 2;               // one of the eight reactions the server accepts
  bool remove = 3;                // true removes the reader's reaction instead of adding it
}

message JoinVoice {
  string room_id = 1;             // the text room whose voice channel to join; requires text membership
}

message LeaveVoice {
  string room_id = 1;
}

// Server -> client. One ServerFrame per binary WebSocket message.
message ServerFrame {
  oneof payload {
    Welcome welcome = 1;
    ChatMessage message = 2;
    Error error = 3;
    Pong pong = 4;
    RoomState room_state = 5;
    MemberJoined member_joined = 6;
    MemberLeft member_left = 7;
    VoiceReady voice_ready = 8;
    VoiceState voice_state = 9;
    VoiceMemberJoined voice_member_joined = 10;
    VoiceMemberLeft voice_member_left = 11;
    Speaking speaking = 12;
    RoomList room_list = 13;
    RoomUpdated room_updated = 14;
    MessageEdited message_edited = 15;
    MessageDeleted message_deleted = 16;
    ReactionsChanged reactions_changed = 17;
  }
}

message Welcome {
  int64 latest_message_id = 1;    // 0 when no message exists yet
  int64 member_id = 2;            // the connected user's id, as it appears in Member.user_id
  string username = 3;            // canonical casing
}

message Pong {
  int64 sent_at_unix_ms = 1;      // echoed from the Ping
}

// A user, as listed by GET /api/users and as a room member.
message Member {
  int64 user_id = 1;
  string username = 2;
}

// Full membership of one room; replaces whatever the client knew about that room.
message RoomState {
  string room_id = 1;
  repeated Member members = 2;
}

message MemberJoined {
  string room_id = 1;
  Member member = 2;
}

message MemberLeft {
  string room_id = 1;
  int64 user_id = 2;
}

// A user in a room's voice channel. ssrc identifies that user's media packets.
message VoiceMember {
  int64 user_id = 1;
  string username = 2;
  uint32 ssrc = 3;                // non-zero, unique across live voice sessions
}

// Sent only to the joiner: where to send media and with which key.
message VoiceReady {
  string room_id = 1;
  string host = 2;                // empty means the host of the WebSocket URL
  uint32 port = 3;                // UDP
  bytes key = 4;                  // 32 bytes, ChaCha20-Poly1305, valid for this voice session only
  uint32 ssrc = 5;                // the joiner's own ssrc
}

// Full voice membership of one room; replaces whatever the client knew.
message VoiceState {
  string room_id = 1;
  repeated VoiceMember members = 2;
}

message VoiceMemberJoined {
  string room_id = 1;
  VoiceMember member = 2;
}

message VoiceMemberLeft {
  string room_id = 1;
  int64 user_id = 2;
}

// Server-derived from media packets, sent to every member of the text room.
message Speaking {
  string room_id = 1;
  int64 user_id = 2;
  bool speaking = 3;
}

// Every room the account can see: every public room plus its own DMs.
message RoomList {
  repeated RoomEntry rooms = 1;
}

// Replaces what the client knows about that room's shared facts; never carries counters.
message RoomUpdated {
  Room room = 1;
}

message MessageEdited {
  ChatMessage message = 1;
}

message MessageDeleted {
  string room_id = 1;
  int64 id = 2;
}

// The full grouped reaction set of one message after a change.
message ReactionsChanged {
  string room_id = 1;
  int64 message_id = 2;
  repeated Reaction reactions = 3;
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_PROTOCOL = 1;         // malformed frame, wrong first frame, unsupported version, text frame
  ERROR_CODE_INVALID_NICKNAME = 2; // reserved: no longer sent since accounts exist
  ERROR_CODE_INVALID_MESSAGE = 3;  // empty or too long
  ERROR_CODE_SESSION_REPLACED = 4; // fatal: the same account connected again elsewhere
  ERROR_CODE_UNKNOWN_ROOM = 5;     // non-fatal: room id invalid or unknown
  ERROR_CODE_NOT_A_MEMBER = 6;     // non-fatal: the connection is not in that room
  ERROR_CODE_VOICE_UNAVAILABLE = 7; // non-fatal: the media relay is disabled or not running
  ERROR_CODE_NOT_IN_VOICE = 8;      // non-fatal: LeaveVoice while not in that room's voice channel
  ERROR_CODE_FORBIDDEN = 9;         // non-fatal: not allowed on that room or message
  ERROR_CODE_ROOM_EXISTS = 10;      // non-fatal: the room name slugs to an id already taken
  ERROR_CODE_UNKNOWN_MESSAGE = 11;  // non-fatal: message id unknown, or a tombstone
  ERROR_CODE_INVALID_ATTACHMENT = 12; // non-fatal: attachment unknown, foreign, wrong room or already linked
  ERROR_CODE_INVALID_ROOM_NAME = 13; // non-fatal: the name is empty, too long or slugs to nothing usable
  ERROR_CODE_INVALID_REACTION = 14;  // non-fatal: emoji outside the accepted set
}

message Error {
  ErrorCode code = 1;
  string detail = 2;
  bool fatal = 3;                  // true: the server closes the socket right after sending this
}

// REST: GET /api/messages?room=general&limit=100&before=<id>  (Content-Type: application/x-protobuf)
message MessagePage {
  repeated ChatMessage messages = 1; // ascending by id
  bool has_more = 2;                 // older messages exist before messages[0]
}

// REST: GET /api/users
message UserList {
  repeated Member users = 1;         // every registered user, ordered by username (case-insensitive)
}

// REST: POST /api/auth/register
message RegisterRequest {
  string username = 1;
  string password = 2;
  string invite_code = 3;
}

// REST: POST /api/auth/login
message LoginRequest {
  string username = 1;
  string password = 2;
}

// REST: POST /api/auth/refresh
message RefreshRequest {
  string refresh_token = 1;
}

// REST: POST /api/auth/logout
message LogoutRequest {
  string refresh_token = 1;
}

// REST: POST /api/auth/password (bearer required)
message ChangePasswordRequest {
  string current_password = 1;
  string new_password = 2;
  string refresh_token = 3;          // the caller's own refresh token; it stays valid, every other one is revoked
}

// Body of every 2xx on register, login and refresh.
message TokenResponse {
  string access_token = 1;           // JWT, present as "Authorization: Bearer <token>"
  uint32 expires_in = 2;             // seconds until the access token expires
  string refresh_token = 3;          // opaque; rotates on every refresh
  int64 user_id = 4;
  string username = 5;               // canonical casing
}

// Body of every 4xx/429 on /api/auth/*.
message ApiError {
  string detail = 1;
}
