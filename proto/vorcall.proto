syntax = "proto3";

package vorcall.v1;

option csharp_namespace = "Vorcall.Server.Protocol";

// A persisted chat message. Ids are server-assigned and strictly increasing.
message ChatMessage {
  int64 id = 1;
  string author = 2;
  string text = 3;
  int64 sent_at_unix_ms = 4;
}

// Client -> server. One ClientFrame per binary WebSocket message.
message ClientFrame {
  oneof payload {
    Hello hello = 1;
    SendMessage send = 2;
    Ping ping = 3;
  }
}

// Must be the first frame after the upgrade.
message Hello {
  uint32 protocol_version = 1; // must be 1
  string nickname = 2;         // trimmed, 1..32 chars, no control characters
}

message SendMessage {
  string text = 1;             // trimmed, 1..2000 chars
}

message Ping {
  int64 sent_at_unix_ms = 1;
}

// Server -> client. One ServerFrame per binary WebSocket message.
message ServerFrame {
  oneof payload {
    Welcome welcome = 1;
    ChatMessage message = 2;
    Error error = 3;
    Pong pong = 4;
  }
}

message Welcome {
  int64 latest_message_id = 1; // 0 when the room is empty
}

message Pong {
  int64 sent_at_unix_ms = 1;   // echoed from the Ping
}

enum ErrorCode {
  ERROR_CODE_UNSPECIFIED = 0;
  ERROR_CODE_PROTOCOL = 1;         // malformed frame, wrong first frame, unsupported version, text frame
  ERROR_CODE_INVALID_NICKNAME = 2;
  ERROR_CODE_INVALID_MESSAGE = 3;  // empty or too long
}

message Error {
  ErrorCode code = 1;
  string detail = 2;
  bool fatal = 3;                  // true: the server closes the socket right after sending this
}

// REST: GET /api/messages?limit=100&before=<id>  (Content-Type: application/x-protobuf)
message MessagePage {
  repeated ChatMessage messages = 1; // ascending by id
  bool has_more = 2;                 // older messages exist before messages[0]
}
