[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.3.1"
license = "MIT"

# Oldest client version the current release still lets chat. Clients below it
# show the "Update required" screen; release.yml asserts min_version <= version.
[workspace.metadata.vorcall]
min_version = "0.2.0"

[workspace.dependencies]
# Pure-Rust port of WebRTC's AEC3, noise suppressor and AGC2. Young and its API
# is declared unstable, so it is pinned like opus-rs and lives behind
# vorcall-voice::cleanup.
aec3 = { version = "=0.3.2", default-features = false }
anyhow = "1"
chacha20poly1305 = "=0.11.0"
chrono = "0.4"
# Already in the lock as a rodio dependency; direct use arrives with capture.
cpal = "=0.17.3"
directories = "6"
futures = "0.3"
# Already in the lock through zbus; used directly for key and signature encoding.
hex = "0.4"
iced = { version = "0.14", features = ["tokio", "canvas", "image-without-codecs"] }
# Attachments are decoded off the UI thread, so iced only ever receives RGBA.
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
] }
notify-rust = "4.18"
opus-rs = "=0.1.33"
prost = "0.14"
prost-build = "0.14"
protox = "0.9"
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = [
    "rustls-no-provider",
    "http2",
] }
# The native file dialog for picking attachments; portal-backed on Linux.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
# Already in the lock as the rustls provider; used directly for SHA-256 and Ed25519.
ring = "0.17"
rodio = { version = "0.22.2", default-features = false, features = ["playback"] }
rubato = { version = "=5.0.0", default-features = false }
rustls = { version = "0.23", default-features = false, features = [
    "ring",
    "std",
    "tls12",
    "logging",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "time",
    "sync",
    "net",
] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
webpki-roots = "0.26"

# Global push-to-talk input, one backend per platform. All of these but ashpd
# already sit in the lock as transitive dependencies of winit, rustix or zbus.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }
core-graphics = "0.23"
core-foundation = "0.9"
x11rb = { version = "0.13", features = ["xinput"] }
libc = "0.2"
# `global_shortcuts` is what carries the portal this crate binds against; the
# module does not exist without it.
ashpd = { version = "0.13", default-features = false, features = [
    "tokio",
    "global_shortcuts",
] }

vorcall-core = { path = "crates/vorcall-core" }
vorcall-hotkey = { path = "crates/vorcall-hotkey" }
vorcall-proto = { path = "crates/vorcall-proto" }
vorcall-voice = { path = "crates/vorcall-voice" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# Debug builds must not underrun: the codec, the resampler and the echo
# canceller's FFTs are pure Rust and run at -O0 otherwise.
[profile.dev.package.aec3]
opt-level = 3

[profile.dev.package.opus-rs]
opt-level = 3

[profile.dev.package.rubato]
opt-level = 3

[profile.dev.package.rustfft]
opt-level = 3
